<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>[Your Name] · Mayor of Toronto</title>

    <!-- Google Fonts for a clean, political feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />

    <!-- Font Awesome for the Toronto icon and social icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            /* 
                THE GLASS EFFECT STARTS HERE.
                We use a background image (a beautiful shot of Toronto skyline) 
                and the glass panel sits on top with a blur.
            */
            background: url('https://images.unsplash.com/photo-1517935706615-2717063c2225?q=80&w=2070&auto=format&fit=crop') no-repeat center center/cover;
            padding: 1.5rem;
            position: relative;
        }

        /* A subtle dark overlay so the glass panel pops */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 0;
        }

        /* ---- THE GLASS CARD ---- */
        .glass-card {
            position: relative;
            z-index: 1;
            max-width: 720px;
            width: 100%;
            padding: 3rem 2.5rem;

            /* 
                GLASS MAGIC:
                - Backdrop blur creates the frosted effect
                - Semi-transparent background 
                - Soft border for that "edge" glow
            */
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);

            text-align: center;
            color: #ffffff;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
        }

        /* ---- TORONTO BADGE ---- */
        .city-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            padding: 0.45rem 1.2rem;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 1.5rem;
        }

        .city-badge i {
            margin-right: 0.5rem;
            color: #ffd43b;
        }

        /* ---- HEADLINE ---- */
        h1 {
            font-size: 3.2rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 0.25rem;
            letter-spacing: -0.02em;
        }

        .candidate-name {
            background: linear-gradient(135deg, #ffffff 0%, #d4e0ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subheadline {
            font-size: 1.3rem;
            font-weight: 400;
            opacity: 0.9;
            margin-bottom: 0.5rem;
        }

        .tagline {
            font-size: 1.1rem;
            font-weight: 400;
            opacity: 0.75;
            max-width: 480px;
            margin: 0.5rem auto 1.8rem;
            line-height: 1.6;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1.5rem;
        }

        /* ---- ACTION BUTTONS (also slightly glassy) ---- */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin: 2rem 0 1.8rem;
        }

        .btn-primary {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #fff;
            padding: 0.9rem 2.8rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-primary i {
            font-size: 1rem;
        }

        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.35);
            border-color: rgba(255, 255, 255, 0.7);
            transform: scale(1.03);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .btn-outline {
            background: transparent;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 0.9rem 2.4rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #fff;
            transform: scale(1.03);
        }

        /* ---- SOCIAL LINKS (also glassy) ---- */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            margin-top: 2rem;
            padding-top: 1.8rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .social-links a {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.5rem;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.05);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-decoration: none;
        }

        .social-links a:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-4px);
        }

        /* ---- FORM (glassy input) ---- */
        .email-signup {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            justify-content: center;
            margin-top: 0.5rem;
        }

        .email-signup input {
            flex: 1 1 220px;
            padding: 0.9rem 1.4rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .email-signup input::placeholder {
            color: rgba(255, 255, 255, 0.6);
            font-weight: 400;
        }

        .email-signup input:focus {
            border-color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
        }

        .email-signup button {
            padding: 0.9rem 2rem;
            border-radius: 60px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: 'Inter', sans-serif;
        }

        .email-signup button:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.02);
        }

        /* ---- RESPONSIVE ---- */
        @media (max-width: 550px) {
            .glass-card {
                padding: 2rem 1.5rem;
                border-radius: 2rem;
            }
            h1 {
                font-size: 2.2rem;
            }
            .subheadline {
                font-size: 1rem;
            }
            .btn-primary,
            .btn-outline {
                width: 100%;
                justify-content: center;
            }
            .email-signup input {
                flex: 1 1 100%;
            }
            .email-signup button {
                width: 100%;
                justify-content: center;
            }
        }

        /* A small "Powered by" footer (optional, but adds a pro touch) */
        .footer-note {
            margin-top: 2rem;
            font-size: 0.75rem;
            opacity: 0.4;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <div class="glass-card">

        <!-- Toronto Badge -->
        <div class="city-badge">
            <i class="fas fa-map-pin"></i> Toronto · Ward 1
        </div>

        <!-- Main Heading -->
        <h1>
            <span class="candidate-name">Wincess Dorville</span>
        </h1>
        <p class="subheadline">For Mayor of Toronto</p>
        <p class="tagline">
            <i class="fas fa-arrow-right" style="opacity:0.6; margin-right:8px;"></i>
            A forward-thinking city. A Toronto that works for everyone.
        </p>

        <!-- Primary Actions -->
        <div class="btn-group">
            <a href="#" class="btn-primary">
                <i class="fas fa-hand-peace"></i> Join the Movement
            </a>
            <a href="about.html" class="btn-outline">
                <i class="fas fa-chevron-circle-right"></i>About Wincess
            </a>
            <a href="ourplaform.html" class="btn-outline">
                <i class="fas fa-chevron-circle-right"></i> Our Platform
            </a>
        </div>

        <!-- Email Signup (the most important conversion point) -->
        <div class="email-signup">
            <input type="email" placeholder="Enter your email to stay updated" />
            <button type="button">
                <i class="fas fa-paper-plane" style="margin-right:8px;"></i> Sign Up
            </button>
        </div>

        <!-- Social Proof / Links -->
        <div class="social-links">
            <a href="#" aria-label="Twitter"><i class="fab fa-x-twitter"></i></a>
            <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
            <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
        </div>

        <div class="footer-note">
            <i class="fas fa-shield-alt" style="margin-right:6px;"></i> Official Campaign · Coming Soon
        </div>

    </div>

    <!-- Tiny JavaScript to show a demo alert (you can replace this with real email capture) -->
    <script>
        document.querySelector('.email-signup button').addEventListener('click', function() {
            const emailInput = document.querySelector('.email-signup input');
            const email = emailInput.value.trim();

            if (email === '') {
                alert('🇨🇦 Please enter your email address to stay in the loop!');
                emailInput.focus();
            } else if (!email.includes('@') || !email.includes('.')) {
                alert('Please enter a valid email address, neighbour!');
            } else {
                alert(`✅ Thanks, ${email}! You’re now on the insider list for the campaign.`);
                emailInput.value = '';
            }
        });

        // Allow "Enter" key to trigger the signup
        document.querySelector('.email-signup input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('.email-signup button').click();
            }
        });
    </script>

</body>
</html>
